name: CI/CD Pipeline

on:
  push:
    branches: [kien_dev]

env:
  DOCKER_IMAGE: unic-backend

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build & Deploy
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml,nginx.conf,Dockerfile,Presentation,BusinessLogic,DataAccess"
          target: ${{ secrets.DEPLOY_PATH || '~/unic-backend' }}

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '~/unic-backend' }}

            # ── Create .env file from secrets ──
            cat > .env << 'EOF'
            JWT_KEY=${{ secrets.JWT_KEY }}
            EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            CLOUDINARY_CLOUD=${{ secrets.CLOUDINARY_CLOUD }}
            CLOUDINARY_KEY=${{ secrets.CLOUDINARY_KEY }}
            CLOUDINARY_SECRET=${{ secrets.CLOUDINARY_SECRET }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            EOF

            # ── Build & restart services ──
            docker compose up -d --build --force-recreate

            # ── Clean up old images ──
            docker image prune -f
