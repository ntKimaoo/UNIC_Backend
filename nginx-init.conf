# Temporary config used ONLY during initial SSL certificate generation.
# After cert is obtained, the real nginx.conf (with SSL) takes over.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name chuyencongnhan.io.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'SSL setup in progress...';
            add_header Content-Type text/plain;
        }
    }
}
